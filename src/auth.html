<script>
async function handleLogin() {
  const nombre = document.getElementById('login-nombre').value.trim();
  const pin    = document.getElementById('login-pin').value.trim();
  const raw    = document.getElementById('login-eid').value.trim();
  const eid    = raw.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');

  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('btn-login');

  errEl.style.display = 'none';
  if (!nombre)       { showLoginErr('Escribe tu nombre'); return; }
  if (pin.length < 4){ showLoginErr('El PIN debe tener al menos 4 dígitos'); return; }
  if (!eid)          { showLoginErr('Introduce el ID de la encuesta'); return; }

  btn.textContent = 'Cargando…'; btn.disabled = true;

  try {
    const pinHash = await sha256(pin + '|' + eid);
    const data    = await apiGet({ action: 'all', eid });
    user = { nombre, pinHash, eid };
    try { localStorage.setItem(LS_USER, JSON.stringify(user)); } catch(e) {}
    applyData(data);
    enterSurvey();
  } catch(e) {
    showLoginErr('No se pudo conectar. Comprueba la URL del script en el código.');
    btn.textContent = 'Entrar →'; btn.disabled = false;
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg; el.style.display = 'block';
}

function applyData(data) {
  schema      = data.schema      || [];
  proscontras = data.proscontras || [];
  respondentes= data.respondentes|| [];
  ausencias   = data.ausencias   || [];
}

// ── SESSION RESTORE ─────────────────────────────────────────────────────────
function tryRestoreSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(LS_USER) || 'null');
    if (saved?.nombre && saved?.pinHash && saved?.eid) {
      user = saved;
      document.getElementById('login-nombre').value = saved.nombre;
      document.getElementById('login-eid').value = saved.eid;
      const btn = document.getElementById('btn-login');
      btn.textContent = 'Cargando…'; btn.disabled = true;
      apiGet({ action: 'all', eid: saved.eid })
        .then(d => { applyData(d); enterSurvey(); })
        .catch(() => { btn.textContent = 'Entrar →'; btn.disabled = false; });
    }
  } catch(e) {}
}

function enterSurvey() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('survey-screen').style.display = 'block';
  document.getElementById('utag-nombre').textContent = user.nombre;
  document.getElementById('utag-eid').textContent    = '#' + user.eid;
  diasVal = 5; plazasVal = 3; rangeCount = 0;
  renderAllQuestions();
  renderAusencias();
  restoreDraft();
  startPolling();
}


// 2. ASIGNACIÓN DE EVENTOS (Solo cuando el DOM está listo)
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('btn-login').addEventListener('click', handleLogin);
  ['login-nombre','login-pin','login-eid'].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); })
  );
  
  document.getElementById('btn-logout').addEventListener('click', () => {
    stopPolling();
    try { localStorage.removeItem(LS_USER); } catch(e) {}
    user = null; schema = []; proscontras = []; respondentes = []; ausencias = [];
    document.getElementById('questions-container').innerHTML = '';
    document.getElementById('survey-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    const btn = document.getElementById('btn-login');
    btn.textContent = 'Entrar →'; btn.disabled = false;
  });
});

</script>
