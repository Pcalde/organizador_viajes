<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, label, a, input, textarea, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

:root {
  --bg:     #f5f0e8;
  --card:   #fffdf8;
  --ink:    #1a1612;
  --muted:  #7a6f63;
  --accent: #c94f2c;
  --accent2:#3a6b4a;
  --accent3:#3a5f6b;
  --border: #ddd5c8;
  --rojo_negativo: #bb3030;
  --mas_tres: #0a6bcd;
  --mas_uno: #2c9121;
  --radius: 12px;
}

body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

/* ── LOGIN ─────────────────────────────────────────────────────────────── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px 20px;
}
.login-wrap { width: 100%; max-width: 440px; }
.login-wrap header { text-align: center; margin-bottom: 32px; }
.login-field { margin-bottom: 16px; }
.login-field > label {
  display: block; font-size: 0.82rem; color: var(--muted);
  margin-bottom: 6px; font-weight: 500; letter-spacing: 0.01em;
}
.login-error {
  color: var(--accent); font-size: 0.85rem; margin-top: 12px;
  padding: 10px 14px; background: #fdf0ec; border-radius: 8px;
  display: none;
}

/* ── SURVEY ────────────────────────────────────────────────────────────── */
#survey-screen { padding: 40px 20px 80px; }

header { text-align: center; margin-bottom: 48px; }
header h1 {
  font-family: 'Fraunces', serif; font-size: clamp(2.4rem,6vw,4rem);
  font-weight: 300; line-height: 1.1; letter-spacing: -0.02em;
}
header h1 em { font-style: italic; color: var(--accent); }

.user-tag {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 5px 14px; font-size: 0.82rem;
}
.user-tag .eid { color: var(--muted); font-size: 0.78rem; }
.btn-logout {
  background: none; border: none; cursor: pointer; color: var(--muted);
  font-size: 0.82rem; padding: 0; transition: color 0.15s;
}
.btn-logout:hover { color: var(--accent); }

.poll-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent2); margin-left: 4px; vertical-align: middle;
  opacity: 0.25; transition: opacity 0.4s;
}
.poll-dot.syncing { opacity: 1; }

/* ── LAYOUT ────────────────────────────────────────────────────────────── */
.form-wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }

.card-title {
  font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 300;
  margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
}
.card-title span.num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--ink); color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 500; flex-shrink: 0;
}

/* ── INPUTS ────────────────────────────────────────────────────────────── */
input[type="text"], input[type="password"], input[type="number"] {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 1rem;
  background: var(--bg); color: var(--ink); outline: none; transition: border-color 0.2s;
}
input[type="text"]:focus, input[type="password"]:focus, input[type="number"]:focus { border-color: var(--accent); }

textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
  background: var(--bg); color: var(--ink); outline: none;
  resize: vertical; min-height: 80px; transition: border-color 0.2s;
}
textarea:focus { border-color: var(--accent); }

select {
  width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem;
  background: var(--bg); color: var(--ink); outline: none; cursor: pointer;
  transition: border-color 0.2s;
}
select:focus { border-color: var(--accent); }

/* ── OPTIONS LIST ──────────────────────────────────────────────────────── */
.options-list { display: flex; flex-direction: column; gap: 4px; }
.opt-item { display: flex; flex-direction: column; }

.opt-label {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  font-size: 0.9rem; user-select: none;
}
.opt-label input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
.opt-label .check {
  width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 4px;
  flex-shrink: 0; transition: background 0.15s, border-color 0.15s;
  display: flex; align-items: center; justify-content: center;
}
.opt-label input:checked ~ .check { background: var(--accent2); border-color: var(--accent2); }
.opt-label input:checked ~ .check::after {
  content: ''; display: block; width: 5px; height: 9px;
  border: 2px solid #fff; border-top: none; border-left: none;
  transform: rotate(45deg) translate(-1px,-1px);
}
.opt-label:has(input:checked) { border-color: var(--accent2); background: #eef5f0; }

/* ── RADIO ─────────────────────────────────────────────────────────────── */
.check-radio { border-radius: 50% !important; }
.check-radio::after { width: 8px !important; height: 8px !important; border: none !important; border-radius: 50% !important; background: #fff; transform: none !important; }
.opt-label input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
.opt-label:has(input[type="radio"]:checked) { border-color: var(--accent2); background: #eef5f0; }
.transport-opts { display: flex; flex-direction: column; gap: 10px; }
.plazas-wrap { display: none; margin-top: 14px; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ── PROS/CONTRAS ──────────────────────────────────────────────────────── */
.pc-badge {
  display: flex; gap: 8px; align-items: center;
  padding: 3px 8px 3px 42px; font-size: 0.75rem;
  cursor: pointer; opacity: 0.8; transition: opacity 0.15s; width: fit-content;
}
.pc-badge:hover { opacity: 1; }
.pc-pro { color: var(--accent2); }
.pc-con { color: var(--accent); }
.pc-panel {
  display: none; background: var(--bg);
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 8px 8px; padding: 10px 14px;
  flex-direction: column; gap: 5px; margin-top: -4px;
}
.pc-panel.open { display: flex; }
.pc-entry { display: flex; gap: 8px; align-items: baseline; }
.pc-tipo { font-weight: 700; flex-shrink: 0; font-size: 0.78rem; }
.pc-tipo.pro  { color: var(--accent2); }
.pc-tipo.contra { color: var(--accent); }
.pc-texto { flex: 1; font-size: 0.82rem; }
.pc-autor { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
.pc-add-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pc-add-row input[type=text] {
  flex: 1; min-width: 120px; padding: 6px 10px; font-size: 0.82rem;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--card); font-family: 'DM Sans', sans-serif;
  color: var(--ink); outline: none; transition: border-color 0.15s;
}
.pc-add-row input[type=text]:focus { border-color: var(--accent2); }
.btn-pc {
  padding: 6px 12px; border-radius: 6px; font-size: 0.78rem;
  cursor: pointer; border: 1.5px solid; font-family: 'DM Sans', sans-serif;
  transition: background 0.15s, color 0.15s; white-space: nowrap;
}
.btn-pc-pro  { border-color: var(--accent2); color: var(--accent2); background: none; }
.btn-pc-pro:hover  { background: var(--accent2); color: #fff; }
.btn-pc-contra { border-color: var(--accent); color: var(--accent); background: none; }
.btn-pc-contra:hover { background: var(--accent); color: #fff; }

/* ── ADD OPTION ────────────────────────────────────────────────────────── */
.add-opt-form { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }
.add-opt-trigger {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px dashed var(--border); border-radius: 8px;
  padding: 8px 16px; font-family: 'DM Sans', sans-serif; font-size: 0.875rem;
  color: var(--muted); cursor: pointer; width: 100%; justify-content: center;
  transition: border-color 0.15s, color 0.15s;
}
.add-opt-trigger:hover { border-color: var(--accent2); color: var(--accent2); }
.add-opt-fields { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
.add-opt-fields.open { display: flex; }
.add-opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
.add-opt-row input { flex: 1; min-width: 150px; }
.btn-propose {
  padding: 10px 16px; border: 1.5px solid var(--accent2); border-radius: 8px;
  background: none; color: var(--accent2); font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem; cursor: pointer; white-space: nowrap; align-self: flex-end;
  transition: background 0.15s, color 0.15s;
}
.btn-propose:hover { background: var(--accent2); color: #fff; }

/* ── SLIDER ────────────────────────────────────────────────────────────── */
.price-display { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 300; color: var(--accent); margin-bottom: 14px; }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent2) var(--pct,0%), var(--border) var(--pct,0%));
  outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--accent2);
  box-shadow: 0 2px 6px rgba(0,0,0,0.12); transition: transform 0.15s;
}
input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--accent2);
  box-shadow: 0 2px 6px rgba(0,0,0,0.12); cursor: pointer;
}
.price-labels { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 8px; }

/* ── DATE RANGES ───────────────────────────────────────────────────────── */
.ranges-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.date-range-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; flex-wrap: wrap;
}
.date-range-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.date-range-row input[type="date"] {
  border: none; background: transparent; font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem; color: var(--ink); outline: none; cursor: pointer; padding: 0; width: auto;
}
.date-range-row .sep { color: var(--muted); font-size: 0.85rem; }
.btn-remove {
  margin-left: auto; background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 1.1rem; line-height: 1; padding: 2px 4px;
  border-radius: 4px; transition: color 0.15s;
}
.btn-remove:hover { color: var(--accent); }
.btn-add {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px dashed var(--border); border-radius: 8px;
  padding: 9px 16px; font-family: 'DM Sans', sans-serif; font-size: 0.875rem;
  color: var(--muted); cursor: pointer; width: 100%; justify-content: center;
  transition: border-color 0.15s, color 0.15s;
}
.btn-add:hover { border-color: var(--accent2); color: var(--accent2); }

/* ── STEPPER ───────────────────────────────────────────────────────────── */
.dias-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 18px; }
.stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.stepper button { background: var(--bg); border: none; width: 44px; height: 44px; font-size: 1.2rem; cursor: pointer; color: var(--ink); transition: background 0.15s; }
.stepper button:hover { background: var(--border); }
.stepper span { width: 52px; text-align: center; font-family: 'Fraunces', serif; font-size: 1.25rem; font-weight: 300; border-left: 1px solid var(--border); border-right: 1px solid var(--border); line-height: 44px; }

/* ── TOGGLES ───────────────────────────────────────────────────────────── */
.toggle-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.toggle-label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 0.9rem; user-select: none; }
.toggle-label input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
.toggle-pill { width: 42px; height: 24px; border-radius: 12px; background: var(--border); position: relative; flex-shrink: 0; transition: background 0.2s; }
.toggle-pill::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
.toggle-label input:checked + .toggle-pill { background: var(--accent2); }
.toggle-label input:checked + .toggle-pill::after { transform: translateX(18px); }

/* ── CASAS ─────────────────────────────────────────────────────────────── */
.casa-row { display: flex; align-items: center; gap: 8px; }
.casa-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 6px;
  font-size: 0.8rem; font-weight: 500; background: var(--ink); color: #fff;
  text-decoration: none; flex-shrink: 0; transition: background 0.15s;
}
.casa-num:hover { background: var(--accent2); }
.casa-num.no-link { pointer-events: none; background: var(--muted); }
.casa-label {
  flex: 1; display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  font-size: 0.9rem; user-select: none;
}
.casa-label input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
.casa-label .check { width: 18px; height: 18px; border: 1.5px solid var(--border); border-radius: 4px; flex-shrink: 0; transition: background 0.15s, border-color 0.15s; display: flex; align-items: center; justify-content: center; }
.casa-label input:checked ~ .check { background: var(--accent2); border-color: var(--accent2); }
.casa-label input:checked ~ .check::after { content: ''; display: block; width: 5px; height: 9px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px,-1px); }
.casa-label:has(input:checked) { border-color: var(--accent2); background: #eef5f0; }
.casa-precio { font-size: 0.8rem; color: var(--accent); font-weight: 500; white-space: nowrap; flex-shrink: 0; }

/* ── AUSENCIAS ─────────────────────────────────────────────────────────── */
.aus-note { font-size: 0.82rem; color: var(--muted); margin-bottom: 14px; }
.aus-prob { margin-top: 20px; }
.aus-prob .price-display { font-size: 1.5rem; }
.aus-votos {
  margin-top: 18px; padding: 14px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--border); font-size: 0.85rem;
}
.aus-votos h4 { font-family: 'Fraunces', serif; font-weight: 300; margin-bottom: 10px; font-size: 0.95rem; }
.aus-voto-row { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; font-size: 0.82rem; align-items: center; }
.aus-voto-row:last-child { border-bottom: none; }
.aus-voto-name { font-weight: 500; }
.aus-voto-victims { color: var(--accent); }
.aus-voto-prob { color: var(--accent2); }
.aus-divider { height: 1px; background: var(--border); margin: 10px 0; }

/* ── ADD NEW QUESTION ──────────────────────────────────────────────────── */
.add-q-form { display: none; flex-direction: column; gap: 12px; margin-top: 4px; }
.add-q-form.open { display: flex; }
.add-q-field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
.add-q-opts-container { display: flex; flex-direction: column; gap: 8px; }
.add-q-opt-row { display: flex; gap: 6px; }
.add-q-opt-row input { flex: 1; }
.btn-add-q-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; background: none; border: 1px dashed var(--border);
  border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
  color: var(--muted); cursor: pointer; transition: border-color 0.15s, color 0.15s;
}
.btn-add-q-opt:hover { border-color: var(--accent2); color: var(--accent2); }
.slider-config { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.slider-config label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.slider-config input { width: 100%; }

/* ── GENERATE BUTTON ───────────────────────────────────────────────────── */
.btn-generate {
  width: 100%; padding: 16px; background: var(--ink); color: #fff;
  border: none; border-radius: var(--radius); font-family: 'Fraunces', serif;
  font-size: 1.1rem; font-weight: 300; letter-spacing: 0.01em;
  cursor: pointer; transition: background 0.2s, transform 0.15s;
}
.btn-generate:hover  { background: #2e2820; transform: translateY(-1px); }
.btn-generate:active { transform: translateY(0); }
.btn-generate:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* ── OUTPUT ────────────────────────────────────────────────────────────── */
.output-box { display: none; }
.output-box.visible { display: block; }
.output-box pre { background: #1a1612; color: #e8dfd0; border-radius: var(--radius); padding: 22px; font-size: 0.82rem; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.output-actions { display: flex; gap: 10px; margin-top: 12px; }
.btn-copy, .btn-dl { flex: 1; padding: 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; transition: opacity 0.15s; border: none; }
.btn-copy { background: var(--accent2); color: #fff; }
.btn-dl   { background: var(--accent);  color: #fff; }
.btn-copy:hover, .btn-dl:hover { opacity: 0.85; }
.copied-toast { display: none; text-align: center; font-size: 0.85rem; color: var(--accent2); margin-top: 8px; }
.pond-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px;
  margin-bottom: 6px; background: var(--bg); transition: border-color 0.2s;
}
.pond-row:has(.btn-pond.active) { border-color: var(--accent2); background: #eef5f0; }
.pond-row:has(.btn-pond.active[data-score="-1"]) { border-color: var(--accent); background: #fdf0ec; }
.pond-row:has(.btn-pond.active[data-score="3"]) { border-color: var(--accent3); background: #eceffd; }

.btn-group-pond { display: flex; gap: 4px; }
.btn-pond {
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--card); color: var(--muted); font-family: 'DM Sans', sans-serif;
  font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: all 0.15s;
}
.btn-pond:hover { border-color: var(--ink); color: var(--ink); }
/* Estados activos */
.btn-pond.active[data-score="1"] { background: var(--mas_uno); border-color: var(--mas_uno); color: #fff; }
.btn-pond.active[data-score="3"] { background: var(--mas_tres); border-color: var(--mas_tres); color: #fff; }
.btn-pond.active[data-score="-1"] { background: var(--rojo_negativo); border-color: var(--rojo_negativo); color: #fff; }

#gas-status { font-size: 0.85rem; padding: 10px 14px; border-radius: 8px; margin-bottom: -8px; display: none; text-align: center; }
</style>
