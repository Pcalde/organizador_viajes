<script>
function startPolling() {
  stopPolling(); // Ensure no duplicates
  pollTimer = setInterval(async () => {
    if (!user) return;
    try {
      document.getElementById('poll-dot').classList.add('syncing');
      const data = await apiGet({ action: 'all', eid: user.eid });
      applyPollUpdate(data);
    } catch(e) {
      console.warn("Polling error:", e);
    } finally {
      setTimeout(() => document.getElementById('poll-dot').classList.remove('syncing'), 800);
    }
  }, POLL_INTERVAL);
}

function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
}

function applyPollUpdate(data) {
  // 1. Guardar estados anteriores para comparar
  const oldSchemaStr = JSON.stringify(schema);
  const oldPCStr = JSON.stringify(proscontras); // <- NUEVO
  
  // 2. Actualizar estado global
  schema = data.schema || [];
  proscontras = data.proscontras || [];
  respondentes = data.respondentes || [];
  ausencias = data.ausencias || [];

  const schemaChanged = JSON.stringify(schema) !== oldSchemaStr;
  const pcChanged = JSON.stringify(proscontras) !== oldPCStr;

  // 3. Manejar nuevas preguntas / opciones
  if (schemaChanged) {
    schema.forEach((q, idx) => {
      let card = document.querySelector(`.card[data-qid="${q.id}"]`);
      if (!card) {
        card = buildQuestionCard(q, idx);
        const addCard = document.getElementById('add-question-card');
        document.getElementById('questions-container').insertBefore(card, addCard);
      } else {
        const list = card.querySelector('.options-list');
        if (list) {
          q.opciones.forEach((op, i) => {
            const val = typeof op === 'string' ? op : op.nombre;
            if (!list.querySelector(`[data-val="${CSS.escape(val)}"]`)) {
              const isCasa = q.tipo === 'casas';
              const item = isCasa ? createCasaItem(q.id, op, list.children.length + 1) : createOptItem(q.id, val);
              list.appendChild(item);
            }
          });
        }
      }
    });
  }

  // 4. Refrescar Pros/Contras SOLO si ha habido cambios en ellos o en el schema base
  if (schemaChanged || pcChanged) {
    const qids = new Set(schema.map(q => q.id));
    qids.forEach(qid => refreshPC(qid));
  }

  // 5. Update Ausencias section
  renderAusencias();
}


</script>
