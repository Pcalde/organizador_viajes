<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbx4lHZVam0Bx9UbRBTQjRkjPipQC6HejD1tFZV9oS08wRJwby6PGM3efXa6qb27UOyP1Q/exec';
const POLL_INTERVAL = 6000; // ms
const LS_USER  = 'viaje_v2_user';
const LS_DRAFT = eid => `viaje_v2_draft_${eid}`;

// ── STATE ──────────────────────────────────────────────────────────────────
let user        = null;  // { nombre, pinHash, eid }
let schema      = [];
let proscontras = [];
let respondentes = [];
let ausencias   = [];
let pollTimer   = null;
let jsonCache   = '';
let nombreCache = '';
let diasVal     = 5;
let plazasVal   = 3;
let rangeCount  = 0;
let saveTimer   = null;

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


function triggerSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveDraft, 800);
}

function saveDraft() {
  if (!user) return;
  try {
    const answers = collectAnswers();
    localStorage.setItem(LS_DRAFT(user.eid), JSON.stringify(answers));
  } catch(e) {}
}

function restoreDraft() {
  if (!user) return;
  try {
    const raw = localStorage.getItem(LS_DRAFT(user.eid));
    if (!raw) return;
    const draft = JSON.parse(raw);

    schema.forEach(q => {
      const card = document.querySelector(`.card[data-qid="${q.id}"]`);
      if (!card) return;

      if (q.id === 'opciones-destino') {
        const vals = draft.opciones || [];
        card.querySelectorAll('input[type=checkbox]').forEach(i => {
          if (vals.includes(i.value)) i.checked = true;
        });
      } else if (q.id === 'casas') {
        const vals = (draft.casas || []).map(c => c.nombre);
        card.querySelectorAll('input[type=checkbox]').forEach(i => {
          if (vals.includes(i.value)) i.checked = true;
        });
      } else if (q.id === 'precio') {
        if (draft.precioMaxPP) {
          const inp = card.querySelector('input[type=range]');
          if (inp) {
            inp.value = draft.precioMaxPP;
            card.querySelector('.price-display').textContent = draft.precioMaxPP + '€';
            const pct = ((draft.precioMaxPP - inp.min) / (inp.max - inp.min)) * 100;
            inp.style.setProperty('--pct', pct + '%');
          }
        }
      } else if (q.id === 'transporte') {
        if (draft.transporte?.estado) {
          const rad = card.querySelector(`input[type=radio][value="${draft.transporte.estado}"]`);
          if (rad) {
            rad.checked = true;
            rad.dispatchEvent(new Event('change')); // Fuerza mostrar el submenú de plazas si aplica
          }
          if (draft.transporte.estado === 'llevo-coche' && draft.transporte.plazasLibres) {
            plazasVal = draft.transporte.plazasLibres;
            const disp = card.querySelector('#plazas-val');
            if (disp) disp.textContent = plazasVal;
          }
        }
      } else if (q.id === 'disponibilidad') {
        if (draft.diasMax) {
          diasVal = draft.diasMax;
          const dDisp = card.querySelector('#dias-val');
          if (dDisp) dDisp.textContent = diasVal;
        }
        if (draft.disponibilidad) {
          if (draft.disponibilidad.soloFinde) document.getElementById('solo-finde').checked = true;
          if (draft.disponibilidad.meDaIgual) document.getElementById('me-da-igual').checked = true;
          if (draft.disponibilidad.preferirPuente) document.getElementById('puente').checked = true;
        }
        if (draft.rangosFechas && draft.rangosFechas.length > 0) {
          const list = document.getElementById('ranges-list');
          if (list) list.innerHTML = ''; // Limpiar el rango por defecto
          draft.rangosFechas.forEach(r => addDateRange(r.desde, r.hasta));
        }
      } else {
        // Mapeo dinámico para preguntas de schema flexible
        if (q.tipo === 'checkbox') {
          const vals = draft.extras?.[q.id] || [];
          card.querySelectorAll('input[type=checkbox]').forEach(i => {
            if (vals.includes(i.value)) i.checked = true;
          });
        } else if (q.tipo === 'voto-ponderado') {
          const dict = draft.extras?.[q.id] || {};
          for (const [val, score] of Object.entries(dict)) {
            const btn = card.querySelector(`.opt-item[data-val="${CSS.escape(val)}"] .btn-pond[data-score="${score}"]`);
            if (btn) btn.classList.add('active');
          }
        } else if (q.tipo === 'textarea') {
          const txt = card.querySelector('textarea');
          if (txt && draft.extras?.[q.id]) {
            txt.value = draft.extras[q.id];
          }
        }
      }
    });

    // Restauración de variables globales de ausencias (independientes del schema base)
    if (draft.prob_asistencia_propia !== undefined) {
      const probSlider = document.getElementById('aus-prob-slider');
      if (probSlider) {
        probSlider.value = draft.prob_asistencia_propia;
        probSlider.dispatchEvent(new Event('input')); // Actualiza el número visual
      }
    }

  } catch(e) {
    console.warn("Fallo en la deserialización del estado local.", e);
  }
}




</script>
