<script>
// 1. Funciones globales
function collectAnswers() {
  const result = {
    timestamp: new Date().toISOString(),
    opciones: [],
    casas: [],
    extras: {} // Dynamic questions go here
    
  };

  schema.forEach(q => {
    const card = document.querySelector(`.card[data-qid="${q.id}"]`);
    if (!card) return;
    if (q.tipo === 'checkbox') {
        result.extras[q.id] = Array.from(card.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
      } else if (q.tipo === 'voto-ponderado') {
        const dictVotos = {};
        card.querySelectorAll('.pond-item').forEach(item => {
          const activeBtn = item.querySelector('.btn-pond.active');
          if (activeBtn) {
            dictVotos[item.dataset.val] = parseInt(activeBtn.dataset.score);
          }
        });
        result.extras[q.id] = dictVotos;
      }
    if (q.id === 'opciones-destino') { // Backwards compatible key
      result.opciones = Array.from(card.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
    } else if (q.id === 'casas') { // Backwards compatible key
      result.casas = Array.from(card.querySelectorAll('input[type=checkbox]:checked')).map(i => {
        const op = q.opciones.find(o => o.nombre === i.value);
        return { nombre: i.value, precio: op?.precio || null };
      });
    } else if (q.id === 'precio') {
      result.precioMaxPP = +(card.querySelector('input[type=range]').value);
    } else if (q.id === 'transporte') {
      const checked = card.querySelector('input[type=radio]:checked');
      if (checked) {
        result.transporte = checked.value === 'llevo-coche' 
          ? { estado: 'llevo-coche', plazasLibres: plazasVal } 
          : { estado: checked.value };
      }
    } else if (q.id === 'disponibilidad') {
      result.diasMax = diasVal;
      result.disponibilidad = {
        soloFinde: document.getElementById('solo-finde')?.checked || false,
        meDaIgual: document.getElementById('me-da-igual')?.checked || false,
        preferirPuente: document.getElementById('puente')?.checked || false
      };
      result.rangosFechas = Array.from(document.querySelectorAll('.date-range-row')).map(row => ({
        desde: row.querySelector('.range-from').value || null,
        hasta: row.querySelector('.range-to').value || null
      })).filter(r => r.desde || r.hasta);
    } else {
      // Handle dynamic questions proposed by users
      if (q.tipo === 'checkbox') {
        result.extras[q.id] = Array.from(card.querySelectorAll('input[type=checkbox]:checked')).map(i => i.value);
      } else if (q.tipo === 'textarea') {
        result.extras[q.id] = card.querySelector('textarea').value;
      }
      // Add other dynamic types here
    }
  });
  
  // Collect Ausencias if visible
  const ausCard = document.getElementById('ausencias-card');
  if (ausCard && ausCard.style.display !== 'none') {
    const sospechosos = Array.from(ausCard.querySelectorAll('.aus-check:checked')).map(i => i.value);
    const prob = +(document.getElementById('aus-prob-slider').value);
    
    // We send this separately via API to update the global Ausencias sheet, 
    // but also keep it in the JSON for your Python scripts.
    result.ausencias_predichas = sospechosos;
    result.prob_asistencia_propia = prob;

    // Fire-and-forget update to the Ausencias sheet
    apiPost({
      action: 'vote_ausencia',
      eid: user.eid,
      nombre: user.nombre,
      pinHash: user.pinHash,
      candidatos: sospechosos,
      prob_propia: prob
    }).catch(console.warn);
  }

  return result;
}


/**
 * 2. ASIGNACIÓN DE EVENTOS:
 * Esto sí debe ir dentro del listener porque necesitamos que el 
 * botón físico exista en la pantalla antes de darle órdenes.
 */
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('btn-generate');
  
  if (btn) {
    btn.addEventListener('click', async () => {
      if (!user) return;
      btn.disabled = true;
      btn.textContent = 'Procesando...';

      try {
        const answers = collectAnswers(); // Ahora sí la encuentra
        
        // Validación de fechas
        const invalido = answers.disponibilidad?.rangosFechas?.find(r => r.desde && r.hasta && r.hasta < r.desde);
        if (invalido) {
          alert("Error en las fechas.");
          btn.disabled = false;
          return;
        }

        await apiPost({
          action: 'submit_response',
          eid: user.eid,
          nombre: user.nombre,
          pinHash: user.pinHash,
          answers: answers
        });

        alert("¡Respuesta enviada con éxito!");
        localStorage.removeItem(LS_DRAFT(user.eid));
      } catch (error) {
        alert("Error al enviar.");
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generar y enviar mi respuesta →';
      }
    });
  }
});
</script>
