<script>
function createAddOptForm(q, isRadio) {
  const wrap = document.createElement('div'); wrap.className = 'add-opt-form';
  const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'add-opt-trigger'; trigger.textContent = '+ Proponer opción';
  const fields  = document.createElement('div'); fields.className = 'add-opt-fields';
  trigger.addEventListener('click', () => fields.classList.toggle('open'));

  const row = document.createElement('div'); row.className = 'add-opt-row';
  const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Nueva opción…';
  const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-propose'; btn.textContent = 'Proponer →';
  btn.addEventListener('click', () => submitNewOpcion(q, inp.value.trim(), inp, isRadio));
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  row.append(inp, btn); fields.appendChild(row);
  wrap.append(trigger, fields);
  return wrap;
}

function createAddCasaForm(q) {
  const wrap    = document.createElement('div'); wrap.className = 'add-opt-form';
  const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'add-opt-trigger'; trigger.textContent = '+ Proponer casa';
  const fields  = document.createElement('div'); fields.className = 'add-opt-fields';
  trigger.addEventListener('click', () => fields.classList.toggle('open'));

  const inNombre = document.createElement('input'); inNombre.type = 'text'; inNombre.placeholder = 'Nombre o descripción *';
  const inPrecio = document.createElement('input'); inPrecio.type = 'text'; inPrecio.placeholder = 'Precio (p.ej. 280€)';
  const inUrl    = document.createElement('input'); inUrl.type    = 'text'; inUrl.placeholder    = 'URL (opcional)';
  const btn      = document.createElement('button'); btn.type = 'button'; btn.className = 'btn-propose'; btn.textContent = 'Proponer →';
  btn.addEventListener('click', () => {
    const nombre = inNombre.value.trim();
    if (!nombre) { inNombre.focus(); return; }
    submitNewCasa(q, { nombre, precio: inPrecio.value.trim(), url: inUrl.value.trim() });
    inNombre.value = ''; inPrecio.value = ''; inUrl.value = '';
    fields.classList.remove('open');
  });
  fields.append(inNombre, inPrecio, inUrl, btn);
  wrap.append(trigger, fields);
  return wrap;
}

async function submitNewOpcion(q, valor, inp, isRadio) {
  if (!valor || !user) { inp?.focus(); return; }
  const card = document.querySelector(`.card[data-qid="${q.id}"]`);
  const list = card?.querySelector(`.options-list[data-qid="${q.id}"]`);
  if (list && !list.querySelector(`[data-val="${CSS.escape(valor)}"]`)) {
    const item = createOptItem(q.id, valor);
    item.querySelector('input[type=checkbox]').checked = true;
    list.appendChild(item);
    if (!q.opciones.includes(valor)) q.opciones.push(valor);
    refreshPC(q.id);
  }
  if (inp) { inp.value = ''; inp.closest('.add-opt-fields')?.classList.remove('open'); }
  await apiPost({ action: 'add_opcion', eid: user.eid, nombre: user.nombre, pinHash: user.pinHash, questionId: q.id, opcion: valor });
}

async function submitPC(qid, optKey, tipo, inputEl) {
  const texto = inputEl.value.trim();
  if (!texto || !user) { inputEl.focus(); return; }

  // Optimistic
  proscontras.push({ qid, optKey, tipo, texto, autor: user.nombre, ts: new Date().toISOString() });
  refreshPC(qid);
  const item = document.querySelector(`.opt-item[data-qid="${qid}"][data-val="${CSS.escape(optKey)}"]`);
  if (item) item.querySelector('.pc-panel')?.classList.add('open');
  inputEl.value = '';

  await apiPost({ action: 'add_proscontra', eid: user.eid, nombre: user.nombre, pinHash: user.pinHash, questionId: qid, optKey, tipo, texto });
}


async function submitNewCasa(q, casa) {
  if (!user) return;
  const card = document.querySelector(`.card[data-qid="${q.id}"]`);
  const list = card?.querySelector(`.options-list[data-qid="${q.id}"]`);
  if (list && !list.querySelector(`[data-val="${CSS.escape(casa.nombre)}"]`)) {
    const n    = list.children.length + 1;
    const item = createCasaItem(q.id, casa, n);
    item.querySelector('input[type=checkbox]').checked = true;
    list.appendChild(item);
    if (!q.opciones.find(o => o.nombre === casa.nombre)) q.opciones.push(casa);
    refreshPC(q.id);
  }
  await apiPost({ action: 'add_opcion', eid: user.eid, nombre: user.nombre, pinHash: user.pinHash, questionId: q.id, opcion: casa });
}

document.addEventListener('DOMContentLoaded', () => {
    
document.getElementById('btn-submit-new-q').addEventListener('click', async () => {
  const tipo  = document.getElementById('add-q-tipo').value;
  const label = document.getElementById('add-q-label').value.trim();
  if (!label) { document.getElementById('add-q-label').focus(); return; }

  const id = label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,30) + '_' + Date.now().toString(36);

  let opciones = [], config = {};

  if (tipo === 'slider') {
    config = {
      min:  +(document.getElementById('aq-min').value  || 0),
      max:  +(document.getElementById('aq-max').value  || 100),
      step: +(document.getElementById('aq-step').value || 10),
    };
    config.default = Math.round((config.min + config.max) / 2);
  } else if (tipo === 'casas') {
    // Si creamos una sección de casas, convertimos los textos en objetos de casa
    opciones = Array.from(document.getElementById('add-q-opts-container').querySelectorAll('input[type=text]'))
      .map(i => ({ nombre: i.value.trim(), precio: "", url: "" }))
      .filter(o => o.nombre);
  } else if (!['textarea', 'disponibilidad'].includes(tipo)) {
    opciones = Array.from(document.getElementById('add-q-opts-container').querySelectorAll('input[type=text]'))
      .map(i => i.value.trim()).filter(Boolean);
  }

  const pregunta = { id, tipo, label, opciones, config };
  
  // Optimismo: añadir a la vista actual
  schema.push(pregunta);
  const card = buildQuestionCard(pregunta, schema.length - 1);
  if (card) {
    const container = document.getElementById('questions-container');
    container.appendChild(card);
  }

  // Reset y cierre
  document.getElementById('add-q-form').classList.remove('open');

  await apiPost({ action: 'add_pregunta', eid: user.eid, nombre: user.nombre, pinHash: user.pinHash, pregunta });
});


document.getElementById('btn-toggle-add-q').addEventListener('click', () =>
  document.getElementById('add-q-form').classList.toggle('open')
);

document.getElementById('add-q-tipo').addEventListener('change', function() {
  const v = this.value;
  // Ocultar todo por defecto
  document.getElementById('add-q-opciones-wrap').style.display = 'none';
  document.getElementById('add-q-slider-wrap').style.display   = 'none';

  // Mostrar lista de opciones para tipos que las necesitan
  if (['checkbox', 'radio', 'voto-ponderado', 'casas'].includes(v)) {
    document.getElementById('add-q-opciones-wrap').style.display = 'block';
  }
  
  // Mostrar config de slider
  if (v === 'slider') {
    document.getElementById('add-q-slider-wrap').style.display = 'block';
  }

  // Ajustar el placeholder de las opciones si es tipo "casas"
  const firstOptInp = document.querySelector('#add-q-opts-container input');
  if (v === 'casas') {
    firstOptInp.placeholder = "Nombre de la casa (el precio se añade luego)";
  } else {
    firstOptInp.placeholder = "Opción 1";
  }
});

document.getElementById('btn-add-q-opt').addEventListener('click', () => {
  const cont = document.getElementById('add-q-opts-container');
  const n    = cont.children.length + 1;
  const row  = document.createElement('div'); row.className = 'add-q-opt-row';
  row.innerHTML = `<input type="text" placeholder="Opción ${n}"><button class="btn-remove" type="button">✕</button>`;
  row.querySelector('.btn-remove').addEventListener('click', () => row.remove());
  cont.appendChild(row);
});
// delegate remove clicks in opts container
document.getElementById('add-q-opts-container').addEventListener('click', e => {
  if (e.target.classList.contains('btn-remove')) e.target.closest('.add-q-opt-row').remove();
});

// Function to update the slider visually when the user moves it
document.getElementById('aus-prob-slider').addEventListener('input', function() {
  const val = this.value;
  document.getElementById('aus-prob-display').textContent = val + '%';
  const pct = (val / 100) * 100;
  this.style.setProperty('--pct', pct + '%');
  triggerSave();
});
});


</script>
